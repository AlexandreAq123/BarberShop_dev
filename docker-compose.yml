# Banco LOCAL de desenvolvimento — espelha o MySQL 8 da VPS Hostinger.
# Senhas vêm do .env da raiz (gerado com `pnpm env:secrets`), nunca daqui.
services:
  mysql:
    image: mysql:8.4
    container_name: barber-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina no .env da raiz}
      MYSQL_DATABASE: barber
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?defina no .env da raiz}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?defina no .env da raiz}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:3306:3306" # só acessível na sua máquina
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
