packages:
  - apps/*
  - packages/*

# Segurança de supply chain: só instala versões publicadas há pelo menos 14 dias
# (em minutos). Uma versão maliciosa costuma ser removida antes desse prazo.
minimumReleaseAge: 20160

# pnpm 10 bloqueia scripts de instalação por padrão; liberamos só o necessário.
onlyBuiltDependencies:
  - prisma
  - "@prisma/engines"
  - esbuild

# fastify-type-provider-zod só usa @fastify/swagger e openapi-types em `import type`
# (geração de OpenAPI, que não usamos). Marcados como opcionais para o pnpm não
# instalar o Swagger automaticamente (menos superfície de ataque).
packageExtensions:
  fastify-type-provider-zod@6:
    peerDependenciesMeta:
      "@fastify/swagger":
        optional: true
      openapi-types:
        optional: true
